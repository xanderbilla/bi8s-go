name: bi8s-dev

# Local development stack: API + UI + full observability pipeline

x-restart-policy: &restart-policy
  restart: unless-stopped

x-logging: &default-logging
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  quality:
    build:
      context: ./app
      dockerfile: Dockerfile
      target: quality
    container_name: bi8s_quality_dev
    command: ["/bin/sh", "-c", "echo quality checks passed"]
    profiles: ["quality"]
    networks:
      - bi8s-dev-net

  # Traefik: single ingress; mirrors production routing so local behaviour matches prod.
  # Access the dashboard at http://localhost:8081 during development.
  traefik:
    <<: [*restart-policy, *default-logging]
    image: traefik:v3.7
    container_name: bi8s_traefik_dev
    command:
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--providers.docker.network=bi8s-dev-net"
      - "--providers.docker.constraints=Label(`traefik.constraint`,`bi8s-dev`)"
      - "--entrypoints.web.address=:80"
      - "--api.insecure=true"
      - "--ping=true"
      - "--log.level=INFO"
    ports:
      - "${TRAEFIK_PORT:-80}:80"
      - "${TRAEFIK_DASHBOARD_PORT:-8081}:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    networks:
      - bi8s-dev-net

  # Application
  api:
    <<: [*restart-policy, *default-logging]
    build:
      context: ./app
      dockerfile: Dockerfile
      target: runtime
      args:
        VERSION: ${BUILD_VERSION:-dev}
        COMMIT: ${BUILD_COMMIT:-unknown}
        BUILD_DATE: ${BUILD_DATE:-unknown}
    container_name: bi8s_api_dev
    env_file:
      - .env.dev
    environment:
      APP_ENV: ${APP_ENV:-dev}
      PORT: ${PORT:-:8080}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      STARTUP_HEALTH_CHECK: ${STARTUP_HEALTH_CHECK:-false}
      DYNAMODB_CONTENT_TABLE: ${DYNAMODB_CONTENT_TABLE:-bi8s-content-table-dev}
      DYNAMODB_PERSON_TABLE: ${DYNAMODB_PERSON_TABLE:-bi8s-person-table-dev}
      DYNAMODB_ATTRIBUTE_TABLE: ${DYNAMODB_ATTRIBUTE_TABLE:-bi8s-attributes-table-dev}
      DYNAMODB_ATTRIBUTE_NAME_INDEX: ${DYNAMODB_ATTRIBUTE_NAME_INDEX:-name-index}
      DYNAMODB_CONTENT_CAST_TABLE: ${DYNAMODB_CONTENT_CAST_TABLE:-bi8s-content-cast-table-dev}
      DYNAMODB_CONTENT_ATTRIBUTE_TABLE: ${DYNAMODB_CONTENT_ATTRIBUTE_TABLE:-bi8s-content-attribute-table-dev}
      DYNAMODB_CONTENT_VISIBILITY_CREATED_AT_INDEX: ${DYNAMODB_CONTENT_VISIBILITY_CREATED_AT_INDEX:-visibility-createdAt-index}
      DYNAMODB_CONTENT_VISIBILITY_RELEASE_DATE_INDEX: ${DYNAMODB_CONTENT_VISIBILITY_RELEASE_DATE_INDEX:-visibility-releaseDate-index}
      # S3_BUCKET: disabled — app storage uses B2 Blaze; uncomment to switch back to AWS S3
      # S3_BUCKET: ${S3_BUCKET:-}
      # B2_* vars are sourced from env_file (.env.dev / .env.bi8s) — do not override here
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-https://ui.${APP_DOMAIN:-localhost},https://ops.${APP_DOMAIN:-localhost},https://api.${APP_DOMAIN:-localhost},http://localhost:3000,http://localhost:8080,http://localhost:8443,http://localhost}
      CORS_ALLOW_PRIVATE_NETWORK: ${CORS_ALLOW_PRIVATE_NETWORK:-true}
      OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME:-bi8s-api}
      OTEL_ENABLED: ${OTEL_ENABLED:-true}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-otel-collector:4317}
      OTEL_EXPORTER_OTLP_INSECURE: ${OTEL_EXPORTER_OTLP_INSECURE:-true}
      OTEL_TRACES_ENABLED: ${OTEL_TRACES_ENABLED:-true}
      OTEL_METRICS_ENABLED: ${OTEL_METRICS_ENABLED:-true}
      OTEL_TRACES_SAMPLER_ARG: ${OTEL_TRACES_SAMPLER_ARG:-1.0}
      OTEL_METRIC_EXPORT_INTERVAL_SECONDS: ${OTEL_METRIC_EXPORT_INTERVAL_SECONDS:-15}
      OTEL_SHUTDOWN_TIMEOUT_SECONDS: ${OTEL_SHUTDOWN_TIMEOUT_SECONDS:-5}
      BUILD_VERSION: ${BUILD_VERSION:-dev}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      RATE_LIMIT_BACKEND: ${RATE_LIMIT_BACKEND:-memory}
      RATE_LIMIT_REDIS_FAIL_MODE: ${RATE_LIMIT_REDIS_FAIL_MODE:-fail-open}
      RATE_LIMIT_REDIS_TIMEOUT_MS: ${RATE_LIMIT_REDIS_TIMEOUT_MS:-50}
      SEARCH_ENABLED: ${SEARCH_ENABLED:-true}
      SEARCH_PROVIDER: ${SEARCH_PROVIDER:-opensearch}
      SEARCH_ENDPOINT: ${SEARCH_ENDPOINT:-http://opensearch:9200}
      SEARCH_USERNAME: ${SEARCH_USERNAME:-}
      SEARCH_PASSWORD: ${SEARCH_PASSWORD:-}
      SEARCH_CONTENT_INDEX: ${SEARCH_CONTENT_INDEX:-bi8s-content-search}
      SEARCH_PEOPLE_INDEX: ${SEARCH_PEOPLE_INDEX:-bi8s-people-search}
      SEARCH_REQUEST_TIMEOUT_MS: ${SEARCH_REQUEST_TIMEOUT_MS:-3000}
    ports:
      - "${API_PORT:-8080}:8080"
    depends_on:
      otel-collector:
        condition: service_started
      redis:
        condition: service_healthy
      opensearch:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/v1/livez"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    labels:
      # Reachable at http://api.localhost via Traefik; direct port :8080 still available
      traefik.enable: "true"
      traefik.constraint: "bi8s-dev"
      traefik.http.routers.api.rule: "Host(`api.localhost`) || Host(`api-dev.emm4bi8s.dev`)"
      traefik.http.routers.api.entrypoints: "web"
      traefik.http.services.api.loadbalancer.server.port: "8080"
    networks:
      - bi8s-dev-net

  # UI — Next.js frontend
  ui:
    profiles: [ui]
    <<: [*restart-policy, *default-logging]
    image: ${UI_IMAGE_NAME:-929910138721.dkr.ecr.us-east-1.amazonaws.com/enternflix:efx-image-dev-latest}
    container_name: bi8s_ui_dev
    pull_policy: ${UI_PULL_POLICY:-always}
    # NEXT_PUBLIC_* vars are delivered via env_file (see .env.dev).
    # The image's entrypoint.sh sed-replaces the placeholder URLs baked into the
    # Next.js bundle at startup using NEXT_PUBLIC_CUSTOM_API_URL,
    # NEXT_PUBLIC_CUSTOM_IMAGE_BASE_URL, and NEXT_PUBLIC_SITE_URL.
    # No command override needed — just pass the env vars and let entrypoint.sh run.
    env_file:
      - .env.dev
    environment:
      # Runtime server vars — not bundled by Next.js
      NODE_ENV: ${UI_NODE_ENV:-development}
      PORT: ${UI_CONTAINER_PORT:-3000}
      HOSTNAME: "0.0.0.0"
    ports:
      - "${UI_PORT:-3000}:3000"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget --quiet --tries=1 --spider http://127.0.0.1:3000/ || exit 1",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    depends_on:
      api:
        condition: service_started
    labels:
      # Reachable at http://localhost via Traefik; direct port :3000 still available
      traefik.enable: "true"
      traefik.constraint: "bi8s-dev"
      traefik.http.routers.ui.rule: "Host(`localhost`) || Host(`ui-dev.emm4bi8s.dev`)"
      traefik.http.routers.ui.entrypoints: "web"
      traefik.http.services.ui.loadbalancer.server.port: "3000"
      com.centurylinklabs.watchtower.enable: "true"
    networks:
      - bi8s-dev-net

  # Redis - Shared rate-limit backend. Single replica for local; in prod use
  # a managed Redis (ElastiCache / Upstash) and set REDIS_URL accordingly.
  redis:
    image: redis:7-alpine
    container_name: bi8s_redis_dev
    command:
      [
        "redis-server",
        "--save",
        "",
        "--appendonly",
        "no",
        "--maxmemory",
        "128mb",
        "--maxmemory-policy",
        "allkeys-lru",
      ]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - bi8s-dev-net

  opensearch:
    <<: [*restart-policy, *default-logging]
    image: opensearchproject/opensearch:2.16.0
    container_name: bi8s_opensearch_dev
    environment:
      discovery.type: single-node
      DISABLE_INSTALL_DEMO_CONFIG: "true"
      DISABLE_SECURITY_PLUGIN: "true"
      bootstrap.memory_lock: "true"
      OPENSEARCH_JAVA_OPTS: "-Xms512m -Xmx512m"
    ulimits:
      memlock:
        soft: -1
        hard: -1
    volumes:
      - opensearch-data-dev:/usr/share/opensearch/data
    ports:
      - "${OPENSEARCH_PORT:-9200}:9200"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9200/_cluster/health"]
      interval: 15s
      timeout: 5s
      retries: 20
    networks:
      - bi8s-dev-net

  # Observability stack
  otel-collector:
    <<: [*restart-policy, *default-logging]
    image: otel/opentelemetry-collector-contrib:0.111.0
    container_name: bi8s_otel_collector_dev
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./observability/otel-collector-config.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - "${OTEL_GRPC_PORT:-4317}:4317"
      - "${OTEL_HTTP_PORT:-4318}:4318"
      - "${OTEL_PROM_PORT:-8889}:8889"
      - "13133:13133"
    depends_on:
      tempo:
        condition: service_started
      loki:
        condition: service_started
    networks:
      - bi8s-dev-net

  prometheus:
    <<: [*restart-policy, *default-logging]
    image: prom/prometheus:v2.55.1
    container_name: bi8s_prometheus_dev
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-72h}"
      - "--web.enable-remote-write-receiver"
      - "--enable-feature=exemplar-storage"
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/prometheus-rules.yml:/etc/prometheus/rules/prometheus-rules.yml:ro
      - prometheus-data-dev:/prometheus
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    networks:
      - bi8s-dev-net

  tempo:
    <<: [*restart-policy, *default-logging]
    image: grafana/tempo:2.6.1
    container_name: bi8s_tempo_dev
    command: ["-config.file=/etc/tempo/tempo.yaml", "-config.expand-env=true"]
    environment:
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      S3_BUCKET: ${S3_BUCKET:-bi8s-storage-dev}
    volumes:
      - ./observability/tempo.yaml:/etc/tempo/tempo.yaml:ro
      - tempo-data-dev:/var/tempo
    ports:
      - "${TEMPO_HTTP_PORT:-3200}:3200"
    networks:
      - bi8s-dev-net

  loki:
    <<: [*restart-policy, *default-logging]
    image: grafana/loki:3.2.1
    container_name: bi8s_loki_dev
    command: ["-config.file=/etc/loki/loki-config.yaml"]
    volumes:
      - ./observability/loki-config-local.yaml:/etc/loki/loki-config.yaml:ro
      - loki-data-dev:/loki
    ports:
      - "${LOKI_PORT:-3100}:3100"
    networks:
      - bi8s-dev-net

  promtail:
    <<: [*restart-policy, *default-logging]
    image: grafana/promtail:3.2.1
    container_name: bi8s_promtail_dev
    command: ["-config.file=/etc/promtail/config.yaml"]
    volumes:
      - ./observability/promtail-config.yaml:/etc/promtail/config.yaml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      loki:
        condition: service_started
    networks:
      - bi8s-dev-net

  grafana:
    <<: [*restart-policy, *default-logging]
    image: grafana/grafana:11.3.0
    container_name: bi8s_grafana_dev
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_FEATURE_TOGGLES_ENABLE: "traceqlEditor traceToMetrics"
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN:-}
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data-dev:/var/lib/grafana
    ports:
      - "${GRAFANA_PORT:-4000}:3000"
    depends_on:
      prometheus:
        condition: service_started
      tempo:
        condition: service_started
      loki:
        condition: service_started
    labels:
      # Reachable at http://ops.localhost via Traefik; direct port :4000 still available
      traefik.enable: "true"
      traefik.constraint: "bi8s-dev"
      traefik.http.routers.grafana.rule: "Host(`ops.localhost`) || Host(`ops-dev.emm4bi8s.dev`)"
      traefik.http.routers.grafana.entrypoints: "web"
      traefik.http.services.grafana.loadbalancer.server.port: "3000"
    networks:
      - bi8s-dev-net

  cloudflared:
    <<: [*restart-policy, *default-logging]
    container_name: bi8s_cloudflared_dev
    image: cloudflare/cloudflared:latest
    env_file:
      - path: .env.dev
    command:
      [
        "tunnel",
        "--no-autoupdate",
        "--metrics",
        "0.0.0.0:${CLOUDFLARED_METRICS_PORT:-2000}",
        "run",
      ]
    environment:
      TZ: UTC
      # TUNNEL_TOKEN is sourced from env_file (.env.dev) — do not override here
    depends_on:
      # Tunnel must point to Traefik only; update public hostname in CF Zero Trust to http://traefik:80
      traefik:
        condition: service_healthy
    networks:
      - bi8s-dev-net
    labels:
      logging: "alloy"

  watchtower:
    profiles: [ui]
    <<: [*restart-policy, *default-logging]
    image: containrrr/watchtower:1.7.1
    container_name: bi8s_watchtower_dev
    command:
      - "--label-enable"
      - "--interval"
      - "${WATCHTOWER_INTERVAL:-300}"
      - "--cleanup"
    environment:
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      DOCKER_API_VERSION: "1.44"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - bi8s-dev-net

networks:
  bi8s-dev-net:
    driver: bridge
    name: bi8s-dev-net

volumes:
  prometheus-data-dev:
  tempo-data-dev:
  loki-data-dev:
  grafana-data-dev:
  opensearch-data-dev:
