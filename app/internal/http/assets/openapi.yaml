openapi: 3.0.3
info:
  title: Bi8s API
  version: "1.0.0"
  description: |
    Route-accurate OpenAPI document for the Bi8s API.

    Every response uses the same JSON envelope with `success`, `status`, `message`,
    `data`, `error`, `path`, `requestId`, and `timestamp`.

    Multipart write endpoints under `/v1/a/*` use exact field names as parsed by
    the Go handlers. Use the request body schemas below as the source of truth.
servers:
  - url: /v1
    description: Relative API base path
tags:
  - name: Health
    description: Operational health and documentation endpoints.
  - name: Consumer
    description: Public read-only endpoints.
  - name: Admin
    description: Internal/admin routes. Restrict them at the network perimeter.
paths:
  /health:
    get:
      tags: [Health]
      summary: Deep health check
      description: Runs dependency probes in parallel and reports per-dependency status.
      operationId: getHealth
      responses:
        "200":
          description: All dependencies are healthy.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthEnvelope"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /livez:
    get:
      tags: [Health]
      summary: Liveness probe
      description: Cheap process-alive probe. Does not query downstream dependencies.
      operationId: getLiveness
      responses:
        "200":
          description: Process is alive.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LivenessEnvelope"
  /readyz:
    get:
      tags: [Health]
      summary: Readiness probe
      description: Returns `503 NOT_READY` until bootstrap completes, then behaves like `/health`.
      operationId: getReadiness
      responses:
        "200":
          description: Server is ready and dependencies are healthy.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthEnvelope"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /openapi.yaml:
    get:
      tags: [Health]
      summary: Download OpenAPI YAML
      operationId: getOpenAPISpec
      responses:
        "200":
          description: Raw OpenAPI YAML.
          content:
            application/yaml:
              schema:
                type: string
  /docs:
    get:
      tags: [Health]
      summary: Swagger UI
      operationId: getSwaggerUI
      responses:
        "200":
          description: Swagger UI HTML document.
          content:
            text/html:
              schema:
                type: string
  /c/search:
    get:
      tags: [Consumer]
      summary: Search content and people
      description: |
        Full-text search backed by OpenSearch.

        `in=all` searches both content and people. Use independent pagination
        controls for the content and people result sets.
      operationId: searchConsumer
      parameters:
        - in: query
          name: query
          required: true
          schema:
            type: string
          description: Non-empty search text.
        - in: query
          name: in
          schema:
            type: string
            enum: [all, movie, tv, people]
            default: all
          description: Result scope.
        - in: query
          name: sort
          schema:
            type: string
            enum: [recent, latest, alpha_asc, alpha_desc]
            default: recent
          description: Single sort token only.
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - in: query
          name: contentPage
          schema:
            type: integer
            minimum: 1
            default: 1
          description: Page number for content results. Falls back to `page`.
        - in: query
          name: contentPageSize
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
          description: Page size for content results. Falls back to `pageSize`.
        - in: query
          name: peoplePage
          schema:
            type: integer
            minimum: 1
            default: 1
          description: Page number for people results. Falls back to `page`.
        - in: query
          name: peoplePageSize
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
          description: Page size for people results. Falls back to `pageSize`.
      responses:
        "200":
          description: Search results.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SearchEnvelope"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /c/content/{contentId}/related:
    get:
      tags: [Consumer]
      summary: Get related content
      description: Returns More-Like-This recommendations for the given content item.
      operationId: getRelatedContent
      parameters:
        - $ref: "#/components/parameters/ContentId"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: Related content page.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RelatedContentEnvelope"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /c/content/{contentId}:
    get:
      tags: [Consumer]
      summary: Get content by ID
      operationId: getConsumerContent
      parameters:
        - $ref: "#/components/parameters/ContentId"
      responses:
        "200":
          description: Public content detail.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContentPublicEnvelope"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
  /c/banner:
    get:
      tags: [Consumer]
      summary: Get banner content
      operationId: getConsumerBanner
      parameters:
        - $ref: "#/components/parameters/ContentTypeFilter"
      responses:
        "200":
          description: Banner item.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BannerEnvelope"
        "404":
          $ref: "#/components/responses/NotFound"
  /c/discover:
    get:
      tags: [Consumer]
      summary: Discover content
      description: Returns a paginated feed of public content cards.
      operationId: discoverContent
      parameters:
        - in: query
          name: type
          schema:
            type: string
            enum: [latest, recent, popular, trending]
            default: latest
          description: Discover bucket.
        - in: query
          name: content
          schema:
            type: string
            enum: [movie, tv]
          description: Optional content-type filter.
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/AlphaSort"
      responses:
        "200":
          description: Paged public content list.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PagedMoviePublicEnvelope"
        "400":
          $ref: "#/components/responses/BadRequest"
  /c/attributes:
    get:
      tags: [Consumer]
      summary: List active attributes
      description: Returns active attributes only. Filters by type and optionally sorts alphabetically.
      operationId: listConsumerAttributes
      parameters:
        - in: query
          name: type
          schema:
            type: string
            enum:
              [
                genre,
                genres,
                tag,
                tags,
                mood,
                moods,
                studio,
                studios,
                category,
                categories,
                speciality,
                specialities,
                social,
                socials,
                platform,
                platforms,
              ]
          description: Attribute family filter.
        - $ref: "#/components/parameters/AlphaSort"
      responses:
        "200":
          description: Attribute list.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AttributeListEnvelope"
        "400":
          $ref: "#/components/responses/BadRequest"
  /c/attributes/{id}:
    get:
      tags: [Consumer]
      summary: List content by attribute
      operationId: getContentByAttribute
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            maxLength: 100
            pattern: "^[A-Za-z0-9_-]+$"
          description: Attribute identifier.
        - $ref: "#/components/parameters/ContentTypeFilterNamedContent"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/AlphaSort"
      responses:
        "200":
          description: Minimal paged content list.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PagedMinimalContentEnvelope"
        "400":
          $ref: "#/components/responses/BadRequest"
  /c/people/{peopleId}:
    get:
      tags: [Consumer]
      summary: Get person by ID
      operationId: getConsumerPerson
      parameters:
        - $ref: "#/components/parameters/PeopleId"
      responses:
        "200":
          description: Public person detail.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PersonPublicEnvelope"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
  /c/people/{peopleId}/content:
    get:
      tags: [Consumer]
      summary: List content for a person
      operationId: getConsumerPersonContent
      parameters:
        - $ref: "#/components/parameters/PeopleId"
        - $ref: "#/components/parameters/ContentTypeFilter"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: Minimal paged content list.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PagedMinimalContentEnvelope"
        "400":
          $ref: "#/components/responses/BadRequest"
  /c/play/{contentType}/{contentId}:
    get:
      tags: [Consumer]
      summary: Get playback information
      description: Returns playback URLs for a finished encoder job.
      operationId: getPlayback
      parameters:
        - in: path
          name: contentType
          required: true
          schema:
            type: string
            enum: [movie, tv]
          description: Lowercase content type path token.
        - $ref: "#/components/parameters/ContentId"
      responses:
        "200":
          description: Playback payload.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlaybackEnvelope"
        "404":
          $ref: "#/components/responses/NotFound"
  /a/content/:
    get:
      tags: [Admin]
      summary: List content (admin)
      operationId: listAdminContent
      parameters:
        - $ref: "#/components/parameters/AdminQuery"
        - $ref: "#/components/parameters/AdminSort"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: Paged admin content list.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PagedAdminContentEnvelope"
        "400":
          $ref: "#/components/responses/BadRequest"
    post:
      tags: [Admin]
      summary: Create content
      description: Create a content item using multipart form fields parsed exactly by `ParseContentFromForm`.
      operationId: createContent
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/CreateContentRequest"
      responses:
        "201":
          description: Created content.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminContentEnvelope"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/RateLimited"
  /a/content/{contentId}:
    get:
      tags: [Admin]
      summary: Get content (admin)
      operationId: getAdminContent
      parameters:
        - $ref: "#/components/parameters/ContentId"
      responses:
        "200":
          description: Full admin content detail.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminContentEnvelope"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [Admin]
      summary: Delete content
      operationId: deleteContent
      parameters:
        - $ref: "#/components/parameters/ContentId"
      responses:
        "200":
          description: Content deleted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NullDataEnvelope"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      tags: [Admin]
      summary: Upload a single video asset
      description: |
        Uploads a single video file for an existing content item.

        Exact multipart field names are lowercase: `contentid`, `contenttype`, `assettype`, and `video`.
        `contentid` is optional and overrides the path value if present.
      operationId: uploadContentAsset
      parameters:
        - $ref: "#/components/parameters/ContentId"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/UploadAssetRequest"
      responses:
        "201":
          description: Upload result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssetUploadEnvelope"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
  /a/content/{contentId}/assets/{assetType}/keys/{keyId}:
    delete:
      tags: [Admin]
      summary: Delete a single asset key
      description: Removes one stored asset key from the specified asset bucket.
      operationId: deleteAssetKey
      parameters:
        - $ref: "#/components/parameters/ContentId"
        - in: path
          name: assetType
          required: true
          schema:
            type: string
            enum: [TRAILER, TEASER, CLIP, PROMO, BTS]
          description: Asset bucket to mutate.
        - in: path
          name: keyId
          required: true
          schema:
            type: string
          description: Stored asset key identifier.
      responses:
        "200":
          description: Asset key deleted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssetDeleteEnvelope"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
  /a/people/:
    get:
      tags: [Admin]
      summary: List people (admin)
      operationId: listAdminPeople
      parameters:
        - $ref: "#/components/parameters/AdminQuery"
        - $ref: "#/components/parameters/AdminSort"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: Paged admin people list.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PagedAdminPeopleEnvelope"
        "400":
          $ref: "#/components/responses/BadRequest"
    post:
      tags: [Admin]
      summary: Create person
      description: Create a person using multipart form fields parsed by `ParsePersonFromForm`.
      operationId: createPerson
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/CreatePersonRequest"
      responses:
        "201":
          description: Created person.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminPersonEnvelope"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
  /a/people/{peopleId}:
    get:
      tags: [Admin]
      summary: Get person (admin)
      operationId: getAdminPerson
      parameters:
        - $ref: "#/components/parameters/PeopleId"
      responses:
        "200":
          description: Full admin person detail.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminPersonEnvelope"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [Admin]
      summary: Delete person
      operationId: deletePerson
      parameters:
        - $ref: "#/components/parameters/PeopleId"
      responses:
        "200":
          description: Person deleted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NullDataEnvelope"
        "404":
          $ref: "#/components/responses/NotFound"
  /a/people/{peopleId}/content:
    get:
      tags: [Admin]
      summary: List content for a person (admin)
      description: Returns the same minimal content cards as the consumer variant, but from the admin route group.
      operationId: getAdminPersonContent
      parameters:
        - $ref: "#/components/parameters/PeopleId"
        - $ref: "#/components/parameters/ContentTypeFilter"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: Minimal paged content list.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PagedMinimalContentEnvelope"
        "400":
          $ref: "#/components/responses/BadRequest"
  /a/attributes/:
    get:
      tags: [Admin]
      summary: List attributes (admin)
      operationId: listAdminAttributes
      parameters:
        - $ref: "#/components/parameters/AdminQuery"
        - $ref: "#/components/parameters/AdminSort"
        - $ref: "#/components/parameters/AdminAttributeType"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: All attributes including inactive ones.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AttributeAdminListEnvelope"
    post:
      tags: [Admin]
      summary: Create attribute
      description: Multipart form parsed by `ParseAttributeFromForm`.
      operationId: createAttribute
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/CreateAttributeRequest"
      responses:
        "201":
          description: Created attribute.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AttributeAdminEnvelope"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/Conflict"
  /a/attributes/{attributeId}:
    get:
      tags: [Admin]
      summary: Get attribute (admin)
      operationId: getAdminAttribute
      parameters:
        - $ref: "#/components/parameters/AttributeId"
      responses:
        "200":
          description: Full attribute detail.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AttributeAdminEnvelope"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [Admin]
      summary: Delete attribute
      operationId: deleteAttribute
      parameters:
        - $ref: "#/components/parameters/AttributeId"
      responses:
        "200":
          description: Attribute deleted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NullDataEnvelope"
        "404":
          $ref: "#/components/responses/NotFound"
  /a/reindex:
    post:
      tags: [Admin]
      summary: Trigger full reindex
      operationId: triggerReindex
      responses:
        "200":
          description: Reindex counts.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReindexEnvelope"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /a/search:
    get:
      tags: [Admin]
      summary: Unified admin search
      description: Search and filter content, people, and attributes with one endpoint.
      operationId: adminSearch
      parameters:
        - in: query
          name: entity
          schema:
            type: string
            enum: [all, content, people, attributes]
            default: all
          description: Search scope.
        - $ref: "#/components/parameters/AdminQuery"
        - $ref: "#/components/parameters/AdminSort"
        - $ref: "#/components/parameters/AdminAttributeType"
        - in: query
          name: id
          schema:
            type: string
          description: Optional exact id lookup for detail fetch.
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: Search results grouped by entity.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"
        "400":
          $ref: "#/components/responses/BadRequest"
components:
  parameters:
    ContentId:
      in: path
      name: contentId
      required: true
      schema:
        type: string
        maxLength: 100
        pattern: "^[A-Za-z0-9_-]+$"
      description: Content identifier.
    PeopleId:
      in: path
      name: peopleId
      required: true
      schema:
        type: string
        maxLength: 100
        pattern: "^[A-Za-z0-9_-]+$"
      description: Person identifier.
    AttributeId:
      in: path
      name: attributeId
      required: true
      schema:
        type: string
        maxLength: 100
        pattern: "^[A-Za-z0-9_-]+$"
      description: Attribute identifier.
    Page:
      in: query
      name: page
      schema:
        type: integer
        minimum: 1
        default: 1
      description: One-based page number.
    PageSize:
      in: query
      name: pageSize
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    AdminQuery:
      in: query
      name: q
      schema:
        type: string
      description: Free-text query across relevant entity fields.
    AdminSort:
      in: query
      name: sort
      schema:
        type: string
        enum: [recent, latest, alpha_asc, alpha_desc]
      description: Sort mode for admin list/search endpoints.
    AdminAttributeType:
      in: query
      name: attributeType
      schema:
        type: string
        enum: [GENRE, TAG, MOOD, STUDIO, CATEGORY, SPECIALITY, SOCIAL, PLATFORM]
      description: Optional attribute type filter for attribute search/list.
      description: Items per page.
    Limit:
      in: query
      name: limit
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
      description: Page size for cursor-based endpoints.
    Cursor:
      in: query
      name: cursor
      schema:
        type: string
      description: Opaque pagination cursor from a previous response.
    AlphaSort:
      in: query
      name: sort
      schema:
        type: string
        enum: [alpha_asc, alpha_desc]
      description: Alphabetical sort mode.
    ContentTypeFilter:
      in: query
      name: type
      schema:
        type: string
        enum: [movie, tv]
      description: Optional lowercase content type filter.
    ContentTypeFilterNamedContent:
      in: query
      name: content
      schema:
        type: string
        enum: [movie, tv]
      description: Optional lowercase content type filter.
  responses:
    BadRequest:
      description: Malformed request or validation failure.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    NotFound:
      description: Resource not found.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    Conflict:
      description: Conflicting or duplicate state.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    RateLimited:
      description: Request rejected by rate limiting.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    ServiceUnavailable:
      description: Dependency failure or readiness failure.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    InternalServerError:
      description: Unhandled internal failure.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
  schemas:
    SuccessEnvelope:
      type: object
      required: [success, status, message, data, error, timestamp]
      properties:
        success:
          type: boolean
          example: true
        status:
          type: integer
          example: 200
        message:
          type: string
          example: ok
        data:
          description: Endpoint-specific success payload.
        error:
          type: object
          nullable: true
          example: null
        path:
          type: string
        requestId:
          type: string
        timestamp:
          type: string
          format: date-time
    ErrorPayload:
      type: object
      required: [type, code, title, detail]
      properties:
        type:
          type: string
          enum:
            [
              VALIDATION_ERROR,
              AUTH_ERROR,
              NOT_FOUND_ERROR,
              CONFLICT_ERROR,
              RATE_LIMIT_ERROR,
              CLIENT_ERROR,
              SERVER_ERROR,
              ERROR,
            ]
        code:
          type: string
        title:
          type: string
        detail:
          type: string
        userMessage:
          type: string
        context:
          description: Optional machine-readable details.
    ErrorEnvelope:
      allOf:
        - $ref: "#/components/schemas/SuccessEnvelope"
        - type: object
          properties:
            success:
              example: false
            data:
              nullable: true
            error:
              $ref: "#/components/schemas/ErrorPayload"
    EntityRef:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
        name:
          type: string
    AssetKey:
      type: object
      required: [id, value]
      properties:
        id:
          type: string
        value:
          type: string
    Asset:
      type: object
      required: [type, keys]
      properties:
        type:
          type: string
