$kind: http-request
description: |-
  Paginated minimal list of content featuring the specified person.

  **Path param `peopleId`:** alphanumeric + `-_`, max 100 chars.

  Returns lightweight items: `{id, title, backdropPath}`.
url: "{{baseUrl}}/c/people/{{peopleId}}/content?type=movie&limit=20&cursor="
method: GET
queryParams:
  - key: type
    value: movie
    description: "Filter by content type. Allowed: `movie`, `tv`. Omit for all."
  - key: limit
    value: "20"
    description: "Items per page (default: 20, max: 100)."
  - key: cursor
    value: ""
    description: DynamoDB pagination cursor (base64). Empty for first page.
order: 2000
